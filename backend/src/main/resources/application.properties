spring.application.name=portfolio-backend
server.port=8081

# Database Configuration
# Defaults to in-memory H2 (PostgreSQL mode) for immediate out-of-the-box local testing.
# When NEON_DATABASE_URL / DATABASE_URL / SPRING_DATASOURCE_URL is provided, it connects to Neon PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 console for development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Neon Metadata
neon.project.id=green-lab-52718513
neon.project.branch=production
